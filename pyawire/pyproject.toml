[build-system]
requires = ["hatchling>=1.8.0", "cffi>=1.15.0", "setuptools>=61.0"]
build-backend = "hatchling.build"

[project]
name = "pyawire"
version = "0.1.0"
dependencies = ["cffi>=1.15.0"]

[tool.hatch.build.targets.wheel]
pure-python = false
packages = ["awire"]
exclude = [
    "awire/_binding.c",
    "awire/_binding.o",
]
artifacts = ["awire/_binding*.so", "awire/_binding*.pyd"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.setuptools]
packages = ["awire"]

[tool.cibuildwheel]
build = "cp39-*"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
before-all = "if command -v yum; then yum install -y pkgconfig libusbx-devel; elif command -v apk; then apk add --no-cache pkgconfig libusb-dev; fi"
manylinux-x86_64-image = "manylinux2014"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.hatch.build.targets.sdist.force-include]
"../libs" = "libs"
"../src/aw" = "src/aw"
"../src/mlib" = "src/mlib"
"../LICENSE" = "LICENSE"
