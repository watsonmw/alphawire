name: pyawire wheels

on:
  push:
  pull_request:

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.runner }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            platform: manylinux
          - runner: ubuntu-latest
            arch: aarch64
            platform: manylinux
#          - runner: macos-13
#            arch: x86_64
#            platform: macosx
          - runner: macos-14
            arch: arm64
            platform: macosx
    env:
      CIBW_ARCHS: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tooling
        run: python -m pip install --upgrade cibuildwheel
      - name: Build wheels
        run: python -m cibuildwheel pyawire --output-dir pyawire/dist
      - name: Validate wheel tags
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: |
          python -c '
          import os, pathlib
          from packaging.utils import parse_wheel_filename
          arch, plat = os.environ["EXPECTED_ARCH"], os.environ["EXPECTED_PLATFORM"]
          allowed_plats = [plat, "musllinux"] if plat == "manylinux" else [plat]
          for whl in pathlib.Path("pyawire/dist").glob("*.whl"):
              _, _, _, tags = parse_wheel_filename(whl.name)
              assert any(t.abi == "abi3" for t in tags), f"{whl.name}: missing abi3"
              assert any(any(p in t.platform for p in allowed_plats) and arch in t.platform for t in tags), f"{whl.name}: platform mismatch"
          '
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pyawire-${{ matrix.runner }}-${{ matrix.arch }}
          path: pyawire/dist/*.whl
          if-no-files-found: error
